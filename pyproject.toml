[project]
name = "zephyr"
version = "2.0.0"
description = "Desktop application for generating customisable wind rose diagrams from meteorological Excel datasets."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyside6>=6.11.1",
]

[project.scripts]
zephyr = "zephyr.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zephyr"]
# The bundled Inter faces are part of the product: a build that drops them
# falls back to the platform sans-serif and stops looking like itself.
# The assets hold the app mark and the window/taskbar icon.
artifacts = ["src/zephyr/gui/fonts/*.ttf", "src/zephyr/gui/assets/*"]
